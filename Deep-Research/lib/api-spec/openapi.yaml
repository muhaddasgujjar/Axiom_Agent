openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - bearerAuth: []
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: research
    description: Research workspace operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: authRegister
      tags: [auth]
      summary: Register a new user
      description: Creates a user account and returns a signed JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
        "409":
          description: Email already registered
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Log in
      description: Verifies credentials and returns a signed JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get current user
      description: Returns the authenticated user's details
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthenticated
  /auth/profile:
    patch:
      operationId: authUpdateProfile
      tags: [auth]
      summary: Update profile
      description: Updates the current user's email and/or password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
        "401":
          description: Unauthenticated
        "409":
          description: Email already registered
  /research:
    get:
      operationId: listResearch
      tags: [research]
      summary: List research jobs
      description: Returns the most recent research jobs in the workspace
      responses:
        "200":
          description: Research jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Research"
  /research/start:
    post:
      operationId: startResearch
      tags: [research]
      summary: Start a research job
      description: Starts a research job through the Python research pipeline and records it in the workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchInput"
      responses:
        "201":
          description: Started research job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartedResearch"
        "400":
          description: Invalid research question
        "502":
          description: Research backend unavailable
  /research/sources:
    get:
      operationId: listSources
      tags: [research]
      summary: List source collections
      description: Returns paginated source collections for the current user, ordered by most recent research job
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Number of sources per page
          schema:
            type: integer
            default: 12
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSources"
  /research/{id}:
    get:
      operationId: getResearch
      tags: [research]
      summary: Get a research job
      parameters:
        - $ref: "#/components/parameters/ResearchId"
      responses:
        "200":
          description: Research job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Research"
        "404":
          description: Research job not found
    patch:
      operationId: updateResearch
      tags: [research]
      summary: Rename a research job
      description: Updates the research question/title of an existing research job
      parameters:
        - $ref: "#/components/parameters/ResearchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchUpdateInput"
      responses:
        "200":
          description: Updated research job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Research"
        "404":
          description: Research job not found
    delete:
      operationId: deleteResearch
      tags: [research]
      summary: Delete a research job
      description: Deletes a research job, its synthesized sections, and associated source trails from the database
      parameters:
        - $ref: "#/components/parameters/ResearchId"
      responses:
        "200":
          description: Research job deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResearchResult"
        "404":
          description: Research job not found
  /research/{id}/pause:
    post:
      operationId: pauseResearch
      tags: [research]
      summary: Pause or resume research
      parameters:
        - $ref: "#/components/parameters/ResearchId"
      responses:
        "200":
          description: Updated research job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Research"
        "404":
          description: Research job not found
  /workspace/usage:
    get:
      operationId: getWorkspaceUsage
      tags: [research]
      summary: Get workspace context usage
      description: Returns context usage across the workspace, including report tokens and cached scraped content
      responses:
        "200":
          description: Workspace usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceUsage"
  /workspace/purge-cache:
    post:
      operationId: purgeWorkspaceCache
      tags: [research]
      summary: Purge inactive workspace cache
      description: Clears temporary scraped HTML buffers for inactive research jobs and returns refreshed usage
      responses:
        "200":
          description: Purged workspace cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeCacheResult"
  /workspace/summary:
    get:
      operationId: getWorkspaceSummary
      tags: [research]
      summary: Get workspace summary
      description: Returns lightweight aggregate context for the workspace shell
      responses:
        "200":
          description: Workspace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSummary"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ResearchId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RegisterInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        createdAt:
          type: string
      required:
        - id
        - email
        - createdAt
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user
    UpdateProfileInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
    ResearchInput:
      type: object
      properties:
        query:
          type: string
          minLength: 10
      required:
        - query
    StartedResearch:
      type: object
      properties:
        research_id:
          type: string
        id:
          type: string
        query:
          type: string
        status:
          type: string
          enum: [planning, searching, reading, synthesizing, verifying, formatting, done, paused, failed]
      required:
        - research_id
        - id
        - query
        - status
    Agent:
      type: object
      properties:
        name:
          type: string
        detail:
          type: string
        count:
          type: string
        status:
          type: string
          enum: [queued, active, done]
        progress:
          type: number
      required: [name, detail, count, status, progress]
    Source:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        source:
          type: string
        progress:
          type: number
      required: [type, title, source, progress]
    ResearchSource:
      type: object
      properties:
        researchId:
          type: string
        researchQuery:
          type: string
        status:
          type: string
        type:
          type: string
        title:
          type: string
        source:
          type: string
        progress:
          type: number
      required: [researchId, researchQuery, status, type, title, source, progress]
    PaginatedSources:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResearchSource"
        pagination:
          type: object
          properties:
            total:
              type: number
            page:
              type: number
            limit:
              type: number
            totalPages:
              type: number
          required: [total, page, limit, totalPages]
      required: [data, pagination]
    RecentResearch:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        meta:
          type: string
        status:
          type: string
      required: [id, title, meta, status]
    Research:
      type: object
      properties:
        id:
          type: string
        query:
          type: string
        status:
          type: string
          enum: [planning, searching, reading, synthesizing, verifying, formatting, done, paused, failed]
        progress:
          type: number
        elapsedMinutes:
          type: number
        verificationScore:
          type: number
        sourcesCount:
          type: number
        claimsChecked:
          type: number
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/RecentResearch"
        summary:
          type: string
        report:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - query
        - status
        - progress
        - elapsedMinutes
        - verificationScore
        - sourcesCount
        - claimsChecked
        - agents
        - sources
        - recent
        - summary
        - report
        - createdAt
        - updatedAt
    WorkspaceSummary:
      type: object
      properties:
        activeResearch:
          type: number
        completedReports:
          type: number
        sourcesRead:
          type: number
        contextUsed:
          type: number
      required: [activeResearch, completedReports, sourcesRead, contextUsed]
    ResearchUpdateInput:
      type: object
      properties:
        query:
          type: string
          minLength: 1
      required:
        - query
    DeleteResearchResult:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    WorkspaceUsage:
      type: object
      properties:
        totalTokensUsed:
          type: number
        totalSourcesIndexed:
          type: number
        totalReports:
          type: number
        maxContextLimit:
          type: number
        usedContextPct:
          type: number
      required: [totalTokensUsed, totalSourcesIndexed, totalReports, maxContextLimit, usedContextPct]
    PurgeCacheResult:
      type: object
      properties:
        purgedThreads:
          type: number
        totalTokensUsed:
          type: number
        totalSourcesIndexed:
          type: number
        totalReports:
          type: number
        maxContextLimit:
          type: number
        usedContextPct:
          type: number
      required: [purgedThreads, totalTokensUsed, totalSourcesIndexed, totalReports, maxContextLimit, usedContextPct]

