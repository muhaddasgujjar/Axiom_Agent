# render.yaml — Infrastructure as Code for the Axiom stack.
#
# Services:
#   1. axiom-backend     — FastAPI / LangGraph research pipeline (Docker)
#   2. axiom-api-server  — Express API server (Node) that the React app talks to
#
# PostgreSQL is hosted externally on Neon (free tier); Render only hosts the two
# web services.
#
# One-time manual secrets to create in the Render dashboard:
#   axiom-backend: OPENAI_API_KEY, TAVILY_API_KEY, FRONTEND_URL (Vercel URL)
#   axiom-api-server: JWT_SECRET, PYTHON_API_URL (https://axiom-backend.onrender.com),
#                     DATABASE_URL (Neon Postgres connection string)

services:
  # ---------------------------------------------------------------------------
  # FastAPI / LangGraph backend (Dockerized web service)
  # ---------------------------------------------------------------------------
  - type: web
    name: axiom-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: RESEARCH_CHECKPOINT_DB
        value: research_state.db
      - key: NLI_DEVICE
        value: cpu
      - key: DEFAULT_USER_ID
        value: user-web
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ---------------------------------------------------------------------------
  # Express API server (frontend + DB + research proxy)
  # ---------------------------------------------------------------------------
  - type: web
    name: axiom-api-server
    runtime: node
    plan: free
    region: oregon
    rootDir: Deep-Research
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter @workspace/api-server... && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # External Neon (free tier) Postgres connection string, e.g.
      # postgres://user:password@ep-xxx.us-east-2.aws.neon.tech/axiom
      - key: DATABASE_URL
        sync: false
      # Render's fromService only exposes connectionString/host/hostport/port,
      # not a full URL. Set this to the axiom-backend service URL manually, e.g.
      # https://axiom-backend.onrender.com
      - key: PYTHON_API_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WORKSPACE_MAX_CONTEXT_TOKENS
        value: "1000000"
